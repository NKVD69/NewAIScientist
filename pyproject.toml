[project]
name = "new-ai-scientist"
version = "3.0.0"
description = "AI Co-Scientist: Multi-Agent System for Scientific Discovery"
requires-python = ">=3.12"

[project.optional-dependencies]
analysis = ["pandas>=2.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [
    "chroma_db",
    "papers",
    "frontend",
    "data",
    "docs",
    "__pycache__",
    ".claude",                 # Claude Code worktrees: duplicate copies of source
    "tests/test_suite_legacy.py",  # legacy suite, also ignored by pytest
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long (allow long lines for prompts)
    "B008",  # default arg func call (FastAPI Depends, etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["agents", "models", "utils", "config.py"]
